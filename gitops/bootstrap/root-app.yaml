# App-of-apps. This is the only thing applied by hand. Everything else in the
# cluster arrives because it is committed under gitops/apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: regulated-delivery
  source:
    repoURL: https://github.com/nithinskanda711/gxp-gitops-platform.git
    targetRevision: main
    path: gitops/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
