kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gxp
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  # Drop this worker if the UTM VM is tight on RAM; everything still works.
  - role: worker
